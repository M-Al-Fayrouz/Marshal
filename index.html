        function switchTab(tab) {
            document.getElementById('tab-menu').classList.toggle('hidden', tab !== 'menu');

            document.getElementById('nav-menu').className = tab === 'menu' ? "px-4 py-2 rounded-xl font-bold text-xs bg-amber-500 text-slate-950 cursor-pointer shadow-lg" : "px-4 py-2 rounded-xl font-bold text-xs bg-slate-800 text-slate-300 cursor-pointer";

        async function fetchProducts() {
            const container = document.getElementById('products-container');
            try {
                const { data } = await db.from('products').select('*');
                // لو قاعدة البيانات فاضية أو فيها منتجات، بنعرض المنهج الرسمي أو المحدث من Supabase
                productsList = (data && data.length > 0) ? data : marshallDefaultMenu;
            } catch(e) {
                productsList = marshallDefaultMenu;
            }

            // تجميع المنتجات حسب القسم (Category)
            const categories = {};
            productsList.forEach(p => {
                const cat = p.category || 'ركن الوجبات';
                if(!categories[cat]) categories[cat] = [];
                categories[cat].push(p);
            });

            container.innerHTML = Object.keys(categories).map(cat => `
                <div class="space-y-3">
                    <h3 class="font-black text-base text-amber-400 border-b border-slate-800 pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-utensils text-xs"></i> ${cat}
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${categories[cat].map(p => `
                            <div class="glass-card text-slate-900 rounded-3xl p-4 shadow-sm flex flex-col justify-between hover:shadow-xl">
                                <div>
                                    <div class="h-28 bg-slate-200 rounded-2xl mb-3 overflow-hidden shadow-inner"><img src="${p.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}" class="w-full h-full object-cover"></div>
                                    <h4 class="font-black text-slate-900 text-sm">${p.name}</h4>
                                </div>
                                <div class="flex items-center justify-between mt-4 pt-3 border-t">
                                    <span class="font-black text-amber-600 text-base">${p.price} ج.م</span>
                                    <button type="button" onclick="addToCart('${p.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl cursor-pointer shadow"><i class="fa-solid fa-plus ml-1"></i> إضافة</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function loadMarshallMenu() {
            if(!confirm('هل تريد حقاً استيراد المنيو الأصلي لمارشال إلى قاعدة البيانات؟')) return;
            for(let item of marshallDefaultMenu) {
                await db.from('products').insert([{ name: item.name, category: item.category, price: item.price, image_url: item.image_url }]);
            }
            alert('✅ تم تحميل وتعبئة المنيو الأصلي بنجاح!');
            fetchProducts();
        }

        function addToCart(id) {
            const prod = productsList.find(p => p.id == id);
            if(!prod) return;
            const exist = cart.find(item => item.id == id);
            if(exist) exist.qty += 1; else cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total'), countEl = document.getElementById('cart-count');
            if(cart.length === 0) { container.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">السلة فارغة</p>`; totalEl.innerText = `0 ج.م`; countEl.innerText = `0`; return; }
            let total = 0, count = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty; count += item.qty;
                return `<div class="flex justify-between items-center text-xs bg-slate-50 p-2.5 rounded-2xl border"><div><p class="font-bold text-slate-900">${item.name}</p><p class="text-slate-500">${item.price} × ${item.qty}</p></div><div class="flex items-center gap-1.5"><button type="button" onclick="cart[idx].qty--; if(cart[idx].qty<=0)cart.splice(${idx},1); renderCart();" class="w-7 h-7 bg-slate-200 rounded-xl font-black">-</button><span class="font-black px-1">${item.qty}</span><button type="button" onclick="cart[idx].qty++; renderCart();" class="w-7 h-7 bg-slate-200 rounded-xl font-black">+</button></div></div>`;
            }).join('');
            totalEl.innerText = `${total} ج.م`; countEl.innerText = count;
        }

        async function submitOrder() {
            const name = document.getElementById('student-name').value.trim();
            const phone = document.getElementById('student-phone').value.trim();
            if(cart.length === 0) { alert('السلة فارغة.'); return; }
            if(!name || !/^01[0125][0-9]{8}$/.test(phone)) { alert('ادخل الاسم ورقم هاتف مصري صحيح.'); return; }
            
            const orderId = 'ORD-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const itemsCopy = [...cart];

            const { error } = await db.from('orders').insert([{ id: orderId, student_name: name, student_phone: phone, items: itemsCopy, total: total, status: 'pending_pickup' }]);
            if(error) { alert('خطأ في إرسال الطلب: ' + error.message); return; }

            let myOrders = JSON.parse(localStorage.getItem('student_all_orders') || '[]');
            myOrders.unshift({ id: orderId, name, phone, items: itemsCopy, total, status: 'pending_pickup', time: new Date().toLocaleTimeString('ar-EG') });
            localStorage.setItem('student_all_orders', JSON.stringify(myOrders));

            cart = []; renderCart(); switchTab('track');
        }

        async function loadStudentOrders() {
            const container = document.getElementById('student-orders-container');
            let localOrders = JSON.parse(localStorage.getItem('student_all_orders') || '[]');
            if(localOrders.length === 0) {
                container.innerHTML = `<div class="glass-card text-slate-900 rounded-3xl p-10 text-center space-y-3"><i class="fa-solid fa-qrcode text-5xl text-slate-300"></i><p class="text-xs text-slate-500 font-bold">لا توجد طلبات محفوظة.</p></div>`;
                return;
            }

            for(let ord of localOrders) {
                const { data } = await db.from('orders').select('status').eq('id', ord.id).single();
                if(data) ord.status = data.status;
            }
            localStorage.setItem('student_all_orders', JSON.stringify(localOrders));

            container.innerHTML = localOrders.map(o => {
                const isPending = o.status === 'pending_pickup';
                return `
                    <div class="glass-card text-slate-900 rounded-3xl p-6 shadow-xl border-2 ${isPending ? 'border-amber-400 bg-white' : 'border-slate-300 bg-slate-50/70 opacity-80'} flex flex-col sm:flex-row items-center justify-between gap-5">
                        <div class="space-y-2 text-right w-full sm:w-auto">
                            <div class="flex items-center gap-2">
                                <span class="font-black text-sm text-slate-900">#${o.id}</span>
                                <span class="text-xs px-3 py-1 rounded-full font-extrabold ${isPending ? 'bg-amber-100 text-amber-800 animate-pulse' : 'bg-emerald-100 text-emerald-800'}">
                                    ${isPending ? '🟡 طلب نشط (قيد التجهيز)' : '✅ تم الاستلام بنجاح'}
                                </span>
                            </div>
                            <p class="text-xs font-bold text-slate-700">الاسم: ${o.name} | الهاتف: ${o.phone}</p>
                            <p class="text-xs text-slate-600">المحتويات: ${o.items.map(i => `${i.name} (x${i.qty})`).join(', ')}</p>
                            <p class="text-xs font-black text-amber-600">الإجمالي: ${o.total} ج.م</p>
                        </div>
                        <div class="flex flex-col items-center justify-center">
                            <div class="bg-white p-3 rounded-2xl border-2 shadow-md ${isPending ? 'w-40 h-40 scale-100 border-amber-500' : 'w-24 h-24 opacity-40 filter blur-[0.6px] border-slate-300'} flex items-center justify-center transition-all">
                                <div id="qr-${o.id}"></div>
                            </div>
                            <span class="text-[11px] mt-2 font-bold ${isPending ? 'text-amber-700' : 'text-slate-400'}">${isPending ? '📸 اعرض هذا الكود للكاشير' : 'تم استلام هذا الطلب'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            setTimeout(() => {
                localOrders.forEach(o => {
                    const el = document.getElementById(`qr-${o.id}`);
                    if(el && el.innerHTML === '') {
                        const size = o.status === 'pending_pickup' ? 140 : 80;
                        new QRCode(el, { text: o.id, width: size, height: size, colorDark: "#0f172a", colorLight: "#ffffff" });
                    }
                });
            }, 100);
        }
    </script>
</body>
</html>
