<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كافتيريا الجامعة الذكية | طلبات الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); border: 1px solid rgba(229, 231, 235, 0.8); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black text-xl shadow">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">كافتيريا الجامعة الذكية</h1>
                    <p class="text-[11px] text-slate-400">اطلب من مكانك واستلم بالـ QR</p>
                </div>
            </div>
            <nav class="flex items-center gap-2">
                <button type="button" onclick="switchTab('menu')" id="nav-menu" class="px-3 py-1.5 rounded-lg font-bold text-xs bg-indigo-600 text-white cursor-pointer shadow">المنيو والطلب</button>
                <button type="button" onclick="switchTab('track')" id="nav-track" class="px-3 py-1.5 rounded-lg font-bold text-xs bg-slate-800 text-slate-300 cursor-pointer shadow">سجل طلباتي والـ QR</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <!-- تبيوب المنيو -->
        <section id="tab-menu" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-4">
                    <h2 class="font-bold text-lg text-white flex items-center gap-2"><i class="fa-solid fa-burger text-amber-500"></i> منيو المأكولات المتاح</h2>
                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <p class="text-slate-400 text-xs py-8 col-span-2 text-center">جاري تحميل المنتجات...</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="glass-card text-slate-900 rounded-2xl p-5 shadow-sm sticky top-20 space-y-4">
                        <h2 class="font-bold text-base border-b pb-3 flex items-center justify-between">
                            <span><i class="fa-solid fa-cart-shopping text-indigo-600 ml-2"></i>سلة الطلبات</span>
                            <span id="cart-count" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                        </h2>
                        <div id="cart-items" class="space-y-2 max-h-40 overflow-y-auto"><p class="text-center text-slate-400 text-xs py-4">السلة فارغة</p></div>
                        <div class="space-y-3 pt-3 border-t">
                            <div><label class="block text-xs font-bold text-slate-700 mb-1">اسم الطالب *</label><input type="text" id="student-name" placeholder="محمد أحمد" class="w-full text-xs p-2.5 rounded-xl border outline-none bg-white text-slate-900"></div>
                            <div><label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف (11 رقم) *</label><input type="tel" id="student-phone" maxlength="11" placeholder="01012345678" class="w-full text-xs p-2.5 rounded-xl border outline-none bg-white text-slate-900"></div>
                            <div class="pt-2 flex justify-between items-center font-bold text-slate-800"><span class="text-xs">الإجمالي:</span><span id="cart-total" class="text-lg text-amber-600">0 ج.م</span></div>
                            <button type="button" onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-xs shadow-lg cursor-pointer flex items-center justify-center gap-2"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب وإصدار الـ QR</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- تبيوب تتبع وسجل الطلبات (محفوظ للأبد في التليفون) -->
        <section id="tab-track" class="hidden max-w-3xl mx-auto space-y-6">
            <div class="glass-card text-slate-900 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-base text-slate-900"><i class="fa-solid fa-clock-rotate-left text-indigo-600 ml-2"></i> سجل طلباتك المحفوظة</h3>
                    <p class="text-xs text-slate-500 mt-1">تظل طلباتك القديمة والجديدة محفوظة على هذا الجهاز للأبد.</p>
                </div>
                <button type="button" onclick="loadStudentOrders()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold text-xs px-3 py-2 rounded-xl cursor-pointer"><i class="fa-solid fa-rotate"></i> تحديث الحالة</button>
            </div>

            <div id="student-orders-container" class="space-y-4">
                <p class="text-center text-slate-400 text-xs py-8">لا توجد طلبات مسجلة على هذا الجهاز حالياً.</p>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = "https://tuyauycwzjupwurmilnc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_7BS6oXx7cPu0grBF75TUpg_XQNhs-_1";
        let db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let cart = [], productsList = [];

        window.addEventListener('DOMContentLoaded', () => { fetchProducts(); loadStudentOrders(); });

        function switchTab(tab) {
            document.getElementById('tab-menu').classList.toggle('hidden', tab !== 'menu');
            document.getElementById('tab-track').classList.toggle('hidden', tab !== 'track');
            document.getElementById('nav-menu').className = tab === 'menu' ? "px-3 py-1.5 rounded-lg font-bold text-xs bg-indigo-600 text-white cursor-pointer shadow" : "px-3 py-1.5 rounded-lg font-bold text-xs bg-slate-800 text-slate-300 cursor-pointer shadow";
            document.getElementById('nav-track').className = tab === 'track' ? "px-3 py-1.5 rounded-lg font-bold text-xs bg-indigo-600 text-white cursor-pointer shadow" : "px-3 py-1.5 rounded-lg font-bold text-xs bg-slate-800 text-slate-300 cursor-pointer shadow";
            if(tab === 'track') loadStudentOrders();
        }

        async function fetchProducts() {
            const grid = document.getElementById('products-grid');
            const { data } = await db.from('products').select('*');
            if(!data || data.length === 0) { grid.innerHTML = `<p class="text-slate-400 text-xs py-8 col-span-2 text-center">لا توجد منتجات مضافة.</p>`; return; }
            productsList = data;
            grid.innerHTML = productsList.map(p => `
                <div class="glass-card text-slate-900 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="h-32 bg-slate-200 rounded-xl mb-3 overflow-hidden"><img src="${p.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}" class="w-full h-full object-cover"></div>
                        <h3 class="font-bold text-slate-900 text-base">${p.name}</h3>
                        <p class="text-xs text-slate-500 mt-1">${p.category || 'وجبة'}</p>
                    </div>
                    <div class="flex items-center justify-between mt-4 pt-3 border-t">
                        <span class="font-black text-amber-600 text-base">${p.price} ج.م</span>
                        <button type="button" onclick="addToCart('${p.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl cursor-pointer"><i class="fa-solid fa-plus ml-1"></i> إضافة</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = productsList.find(p => p.id == id);
            if(!prod) return;
            const exist = cart.find(item => item.id == id);
            if(exist) exist.qty += 1; else cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total'), countEl = document.getElementById('cart-count');
            if(cart.length === 0) { container.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">السلة فارغة</p>`; totalEl.innerText = `0 ج.م`; countEl.innerText = `0`; return; }
            let total = 0, count = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty; count += item.qty;
                return `<div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-xl border"><div><p class="font-bold">${item.name}</p><p class="text-slate-500">${item.price} × ${item.qty}</p></div><div class="flex items-center gap-1"><button type="button" onclick="cart[idx].qty--; if(cart[idx].qty<=0)cart.splice(${idx},1); renderCart();" class="w-6 h-6 bg-slate-200 rounded font-bold">-</button><span class="font-bold px-1">${item.qty}</span><button type="button" onclick="cart[idx].qty++; renderCart();" class="w-6 h-6 bg-slate-200 rounded font-bold">+</button></div></div>`;
            }).join('');
            totalEl.innerText = `${total} ج.م`; countEl.innerText = count;
        }

        async function submitOrder() {
            const name = document.getElementById('student-name').value.trim();
            const phone = document.getElementById('student-phone').value.trim();
            if(cart.length === 0) { alert('السلة فارغة.'); return; }
            if(!name || !/^01[0125][0-9]{8}$/.test(phone)) { alert('ادخل الاسم ورقم هاتف مصري صحيح.'); return; }
            
            const orderId = 'ORD-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const itemsCopy = [...cart];

            const { error } = await db.from('orders').insert([{ id: orderId, student_name: name, student_phone: phone, items: itemsCopy, total: total, status: 'pending_pickup' }]);
            if(error) { alert('خطأ في إرسال الطلب: ' + error.message); return; }

            // حفظ الطلب في مصفوفة الطلبات الخاصة بالتليفون للأبد في localStorage
            let myOrders = JSON.parse(localStorage.getItem('student_all_orders') || '[]');
            myOrders.unshift({ id: orderId, name, phone, items: itemsCopy, total, status: 'pending_pickup', time: new Date().toLocaleTimeString('ar-EG') });
            localStorage.setItem('student_all_orders', JSON.stringify(myOrders));

            cart = []; renderCart(); switchTab('track');
        }

        async function loadStudentOrders() {
            const container = document.getElementById('student-orders-container');
            let localOrders = JSON.parse(localStorage.getItem('student_all_orders') || '[]');
            if(localOrders.length === 0) {
                container.innerHTML = `<div class="glass-card text-slate-900 rounded-2xl p-8 text-center space-y-3"><i class="fa-solid fa-qrcode text-4xl text-slate-300"></i><p class="text-xs text-slate-500">لا توجد طلبات محفوظة على هذا الجهاز.</p></div>`;
                return;
            }

            // جلب أحدث حالات الطلبات من قاعدة البيانات لضمان التحديث اللحظي
            for(let ord of localOrders) {
                const { data } = await db.from('orders').select('status').eq('id', ord.id).single();
                if(data) ord.status = data.status;
            }
            localStorage.setItem('student_all_orders', JSON.stringify(localOrders));

            container.innerHTML = localOrders.map(o => `
                <div class="glass-card text-slate-900 rounded-2xl p-5 shadow-md border-2 ${o.status === 'pending_pickup' ? 'border-amber-400' : 'border-emerald-500'} flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="space-y-2 text-right w-full sm:w-auto">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-sm text-slate-900">#${o.id}</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full font-extrabold ${o.status === 'pending_pickup' ? 'bg-amber-100 text-amber-800 animate-pulse' : 'bg-emerald-100 text-emerald-800'}">
                                ${o.status === 'pending_pickup' ? '🟡 قيد التجهيز - توجه للاستلام' : '✅ تم الاستلام بنجاح'}
                            </span>
                        </div>
                        <p class="text-xs font-bold text-slate-700">الاسم: ${o.name} | الهاتف: ${o.phone}</p>
                        <p class="text-xs text-slate-600">المحتويات: ${o.items.map(i => `${i.name} (x${i.qty})`).join(', ')}</p>
                        <p class="text-xs font-black text-amber-600">الإجمالي: ${o.total} ج.م</p>
                    </div>
                    <div class="bg-white p-3 rounded-xl border shadow-inner flex flex-col items-center justify-center">
                        <div id="qr-${o.id}" class="mb-1"></div>
                        <span class="text-[10px] text-slate-400 font-bold">كود الاستلام</span>
                    </div>
                </div>
            `).join('');

            // توليد أكواد الـ QR لكل الطلبات المحفوظة
            setTimeout(() => {
                localOrders.forEach(o => {
                    const el = document.getElementById(`qr-${o.id}`);
                    if(el && el.innerHTML === '') {
                        new QRCode(el, { text: o.id, width: 110, height: 110, colorDark: "#0f172a", colorLight: "#ffffff" });
                    }
                });
            }, 100);
        }
    </script>
</body>
</html>
